# =============================================================
# Nginx (host) — proxy reverso para TODOS os produtos Comenta
# =============================================================
# Copie para /etc/nginx/sites-available/comenta.conf e habilite:
#   sudo ln -s /etc/nginx/sites-available/comenta.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Depois gere o SSL (o certbot preenche os blocos 443 automaticamente):
#   sudo certbot --nginx -d comenta.com.br -d www.comenta.com.br \
#                        -d app.comenta.com.br -d api.comenta.com.br
#
# Os serviços escutam apenas em 127.0.0.1 (ver docker-compose.yml).

# Site / plataforma — comenta.com.br (+ www)
server {
    server_name comenta.com.br www.comenta.com.br;
    listen 80;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Painel — app.comenta.com.br
server {
    server_name app.comenta.com.br;
    listen 80;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# API — api.comenta.com.br (inclui WebSocket / Socket.IO)
server {
    server_name api.comenta.com.br;
    listen 80;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
